[SystemSettings]
; ==============================================================================
; === WARNING: ULTRA OVERKILL PROFILE (EXTREME HARDWARE MELTER)              ===
; === Target: Enthusiast Flagship Rig (RTX 4080 / 4090 / RX 7900 XTX, 32GB+) ===
; === Features: Zero ground flicker, 4K shadow buffers, 5 cascades,         ===
; === ultra volumetric voxel grids, extended foliage culling bounds.          ===
; ==============================================================================

; --- MEMORY & TEXTURE STREAMING ---
r.Streaming.PoolSize=10000
r.Streaming.LimitPoolSizeToVRAM=0
r.Streaming.UseBackgroundThreadPool=1
r.Streaming.AmortizeCPUToGPUCopy=0
r.Streaming.MaxNumTexturesToStreamPerFrame=100
r.Streaming.FramesForFullUpdate=8
r.Streaming.Boost=1
r.Streaming.HLODStrategy=0
r.Streaming.UsingKuroStreamingPriority=3

; --- CPU MULTITHREADING & SHADER PIPELINE ---
r.CreateShadersOnLoad=1
r.Shaders.Optimize=1
r.ShaderPipelineCache.BatchSize=250
r.ShaderPipelineCache.BackgroundBatchSize=50
r.ShaderPipelineCache.BatchTime=3.0
r.ShaderPipelineCache.PrecompileBatchTime=3.0
r.ParallelRendering=1
r.MeshDrawCommands.ParallelPassSetup=1
r.ParallelFrustumCull=1
r.RHICmdUseThread=1
r.RHICmdUseDeferredContexts=1
r.RHICmdBypass=0

; --- HARDWARE VIDEO DECODING & ANIMATIONS ---
Electra.PC.UseSoftwareDecoding=0
a.URO.Enable=0
a.URO.EnableScreenRatio=0
t.Streamline.Reflex.HandleMaxTickRate=true
t.Streamline.Reflex.Enable=1
t.Streamline.Reflex.Mode=1

; --- LIGHTING & SHADOWS (EXTREME 4K RESOLUTION & 5 CASCADES) ---
r.LightFunctionQuality=3
r.ShadowQuality=5
r.Shadow.CSM.MaxCascades=5
r.Shadow.MaxResolution=4096
r.Shadow.PerObjectResolutionMax=1024
r.Shadow.PerObjectResolutionMin=1024
r.Shadow.DistanceScale=2.0
r.Shadow.RadiusThreshold=0.015
r.DistanceFieldShadowing=1
r.DFShadowQuality=3
r.ContactShadows=1

; --- VOLUMETRIC FOG & CLOUDS (ULTRA VOXEL DENSITY) ---
r.VolumetricFog=1
r.VolumetricFog.GridPixelSizeK=6
r.VolumetricFog.GridSizeZ=128
r.VolumetricCloud=1
r.VolumetricCloud.HighQuality=1
r.LightShaftQuality=1
r.TyndallScatteringQuality=1
r.KuroVolumetricLight.ColorMaskDownSampleFactor=1
r.KuroVolumetricLight.DownSampleFactor=1

; --- AMBIENT OCCLUSION & REFLECTIONS ---
r.AmbientOcclusionLevels=3
r.AmbientOcclusionMaxQuality=100
r.AODownsampleFactor=1
r.ScreenSpaceReflections=1
r.SSR.Quality=4
r.SSR.MaxRoughness=1.0
r.SSR.HalfResSceneColor=0
r.RefractionQuality=3

; --- RAY TRACING & LUMEN ENHANCEMENT ---
r.Lumen.ScreenProbeGather.Temporal.DistanceThreshold=0.03
r.Lumen.Reflections.AsyncCompute=1
r.Lumen.Reflections.ScreenTraces=0
r.Lumen.Reflections.SmoothBias=1.0

; --- POST-PROCESSING & CLEAN EFFECTS ---
r.MotionBlurQuality=0
r.DepthOfFieldQuality=0
r.LensFlareQuality=3
r.SceneColorFringeQuality=0
r.TranslucencyVolumeBlur=1
r.EyeAdaptationQuality=2
r.BloomQuality=3
r.Tonemapper.Quality=1
r.Tonemapper.Sharpen=0.2
r.Kuro.KuroEnableFFTBloom=0
r.Kuro.KuroEnableToonFFTBloom=0
r.Kuro.KuroBloomStreak=0
r.Kuro.NiagaraBlur.Enable=0
r.KuroDownsampleTranslucencyFullRes=true
r.Kuro.InteractionEffect.UseCppWaterEffect=1

; --- VEGETATION, DENSITY & VIEW DISTANCE ---
; Safe LOD scaling (>=0.65) to completely eliminate terrain and ground flickering!
foliage.DensityScale=2.0
grass.DensityScale=2.0
foliage.LODDistanceScale=2.0
foliage.DensityScaleLOD.DrawCallOptimize=1
r.Kuro.Foliage.NearCullDistanceMax=9750
r.Kuro.Foliage.MiddleCullDistanceMax=15750
r.Kuro.Foliage.FarCullDistanceMax=22500
r.Kuro.Foliage.GrassCullDistanceMax=22500
r.Kuro.Foliage.Grass3_0CullDistanceMax=30000
r.ViewDistanceScale=2.5
r.StaticMeshLODDistanceScale=0.65
r.SkeletalMeshLODBias=-1

; --- PARTICLES & COMBAT FX ---
fx.MaxCPUParticlesPerEmitter=3000
fx.MaxGPUParticlesSpawnedPerFrame=4096
fx.Niagara.QualityLevel=4

; --- UI & SCALING ---
r.Upscale.Quality=3
r.DetailMode=2
r.PostProcessAAQuality=4
r.ScreenPercentage=100
