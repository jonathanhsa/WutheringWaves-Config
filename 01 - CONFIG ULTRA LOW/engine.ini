[SystemSettings]
; ==============================================================================
; === PROFILE: ULTRA LOW / POTATO MODE (MAXIMUM FPS AT ALL COSTS)            ===
; === Target: Dual/Quad-Core CPUs, 4GB-8GB RAM, Old Intel HD / UHD iGPUs    ===
; ==============================================================================

; --- MEMORY & TEXTURE STREAMING ---
; Conservative pool to eliminate Windows pagefile swapping and out-of-memory crashes
r.Streaming.PoolSize=500
r.Streaming.LimitPoolSizeToVRAM=1
r.Streaming.UseBackgroundThreadPool=1
r.Streaming.AmortizeCPUToGPUCopy=1
r.Streaming.MaxNumTexturesToStreamPerFrame=10
r.Streaming.FramesForFullUpdate=60
r.Streaming.Boost=0
r.Streaming.HLODStrategy=2
r.MipMapLODBias=1
r.Streaming.UsingKuroStreamingPriority=3

; --- CPU MULTITHREADING & SHADER PIPELINE ---
r.CreateShadersOnLoad=1
r.Shaders.Optimize=1
r.ShaderPipelineCache.BatchSize=15
r.ShaderPipelineCache.BackgroundBatchSize=2
r.ShaderPipelineCache.BatchTime=2.0
r.ShaderPipelineCache.PrecompileBatchTime=2.0
r.ParallelRendering=1
r.MeshDrawCommands.ParallelPassSetup=1
r.RHICmdUseThread=1
r.RHICmdUseDeferredContexts=1
r.RHICmdBypass=0

; --- HARDWARE VIDEO DECODING ---
; Offloads cutscenes and resonance liberation to GPU hardware decoder
Electra.PC.UseSoftwareDecoding=0

; --- LIGHTING & SHADOWS (STRIPPED DOWN FOR FILLRATE) ---
r.LightFunctionQuality=0
r.ShadowQuality=0
r.Shadow.CSM.MaxCascades=0
r.Shadow.MaxResolution=128
r.Shadow.RadiusThreshold=0.1
r.Shadow.DistanceScale=0.3
r.DistanceFieldShadowing=0
r.ContactShadows=0
r.VolumetricFog=0
r.VolumetricCloud=0
r.LightShaftQuality=0

; --- AMBIENT OCCLUSION & REFLECTIONS ---
r.AmbientOcclusionLevels=0
r.ScreenSpaceReflections=0
r.SSR.Quality=0
r.RefractionQuality=0

; --- POST-PROCESSING & COMBAT EFFECTS ---
r.MotionBlurQuality=0
r.DepthOfFieldQuality=0
r.LensFlareQuality=0
r.SceneColorFringeQuality=0
r.TranslucencyVolumeBlur=0
r.EyeAdaptationQuality=0
r.BloomQuality=0
r.Tonemapper.Quality=1
r.TonemapperFilm=0
r.Tonemapper.Sharpen=0.8
r.Kuro.KuroEnableFFTBloom=0
r.Kuro.KuroEnableToonFFTBloom=0
r.Kuro.KuroBloomStreak=0
r.Kuro.NiagaraBlur.Enable=0

; --- VEGETATION, DENSITY & VIEW DISTANCE ---
foliage.DensityScale=0
grass.DensityScale=0
foliage.DensityScaleLOD.DrawCallOptimize=1
r.ViewDistanceScale=0.5
r.StaticMeshLODDistanceScale=1.6
r.MeshBlend.Quality=1
r.SkeletalMeshLODBias=2

; --- PARTICLES & COMBAT FX ---
fx.MaxCPUParticlesPerEmitter=15
fx.MaxGPUParticlesSpawnedPerFrame=24
fx.Niagara.QualityLevel=0

; --- UI & SCALING ---
r.Upscale.Quality=3
r.DetailMode=0
r.PostProcessAAQuality=0
r.DefaultFeature.AntiAliasing=0
r.ScreenPercentage=70
