[SystemSettings]
; ==============================================================================
; === PROFILE: LOW SPEC (STABLE 45-60 FPS)                                   ===
; === Target: 4-Core CPUs, 8GB RAM, Integrated GPU with max 2GB VRAM         ===
; ==============================================================================

; --- MEMORY & TEXTURE STREAMING ---
r.Streaming.PoolSize=1000
r.Streaming.LimitPoolSizeToVRAM=1
r.Streaming.UseBackgroundThreadPool=1
r.Streaming.AmortizeCPUToGPUCopy=1
r.Streaming.MaxNumTexturesToStreamPerFrame=20
r.Streaming.FramesForFullUpdate=30
r.Streaming.Boost=0
r.Streaming.HLODStrategy=2

; --- CPU MULTITHREADING & SHADER PIPELINE ---
r.CreateShadersOnLoad=1
r.Shaders.Optimize=1
r.ShaderPipelineCache.BatchSize=30
r.ShaderPipelineCache.BackgroundBatchSize=5
r.ShaderPipelineCache.BatchTime=2.0
r.ShaderPipelineCache.PrecompileBatchTime=2.0
r.ParallelRendering=1
r.MeshDrawCommands.ParallelPassSetup=1
r.RHICmdUseThread=1
r.RHICmdUseDeferredContexts=1
r.RHICmdBypass=0
r.FinishCurrentFrame=0
r.OneFrameThreadLag=1
r.GTSyncType=1

; --- LIGHTING & SHADOWS ---
r.LightFunctionQuality=0
r.ShadowQuality=1
r.Shadow.CSM.MaxCascades=1
r.Shadow.MaxResolution=512
r.Shadow.RadiusThreshold=0.06
r.Shadow.DistanceScale=0.6
r.Shadow.FadeResolution=32
r.Shadow.MinResolution=16
r.DistanceFieldShadowing=0
r.ContactShadows=0
r.VolumetricFog=0
r.VolumetricCloud=0
r.LightShaftQuality=0

; --- AMBIENT OCCLUSION & REFLECTIONS ---
r.AmbientOcclusionLevels=0
r.ScreenSpaceReflections=0
r.SSR.Quality=0
r.RefractionQuality=0

; --- POST-PROCESSING & VISUAL EFFECTS ---
r.MotionBlurQuality=0
r.DepthOfFieldQuality=0
r.LensFlareQuality=0
r.SceneColorFringeQuality=0
r.TranslucencyVolumeBlur=0
r.EyeAdaptationQuality=1
r.BloomQuality=1
r.Tonemapper.Quality=1
r.Tonemapper.Sharpen=0.5

; --- VEGETATION, DENSITY & VIEW DISTANCE ---
foliage.DensityScale=0.5
grass.DensityScale=0.5
r.ViewDistanceScale=0.75
r.StaticMeshLODDistanceScale=1.2
r.SkeletalMeshLODBias=1

; --- PARTICLES & COMBAT FX ---
fx.MaxCPUParticlesPerEmitter=300
fx.MaxGPUParticlesSpawnedPerFrame=256
fx.Niagara.QualityLevel=0

; --- RESOLUTION SCALING & ANTI-ALIASING ---
r.PostProcessAAQuality=2
r.TemporalAA.Algorithm=0
r.TemporalAACurrentFrameWeight=0.25
r.ScreenPercentage=85
