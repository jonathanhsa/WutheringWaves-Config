[SystemSettings]
; ==============================================================================
; === PROFILE: JONATHAN'S PERSONAL CONFIG (CREATOR'S CHOICE - BATTLE SWEET SPOT)
; === Target: 8GB VRAM GPUs (Anti-VRAM Overflow), Smooth Stutter-Free Combat ===
; === Features: 1024 Shadows, -5% Vegetation, -20% Voxel Fog & Reflections,  ===
; === Ray Tracing Disabled, Full Character Detail, Extra CPU/GPU Optimizations =
; ==============================================================================

; --- 8GB VRAM PROTECTION CAP & TEXTURE STREAMING ---
; Capped at 5.6GB texture pool + VRAM limit enabled to prevent 8GB VRAM overflow into system RAM
r.Streaming.PoolSize=5600
r.Streaming.LimitPoolSizeToVRAM=1
r.Streaming.MaxTempMemoryAllowed=128
r.Streaming.UseBackgroundThreadPool=1
r.Streaming.AmortizeCPUToGPUCopy=1
r.Streaming.MaxNumTexturesToStreamPerFrame=45
r.Streaming.FramesForFullUpdate=12
r.Streaming.Boost=1
r.Streaming.HLODStrategy=1
r.Streaming.UsingKuroStreamingPriority=3

; --- EXTRA CPU & GPU PIPELINE OPTIMIZATIONS ---
r.CreateShadersOnLoad=1
r.Shaders.Optimize=1
r.Shaders.FastMath=1
r.ShaderPipelineCache.Enabled=1
r.ShaderPipelineCache.AsyncCompileRate=32
r.ShaderPipelineCache.BatchSize=120
r.ShaderPipelineCache.BackgroundBatchSize=25
r.ShaderPipelineCache.BatchTime=2.0
r.ShaderPipelineCache.PrecompileBatchTime=2.0
r.ParallelRendering=1
r.MeshDrawCommands.ParallelPassSetup=1
r.MeshDrawCommands.DynamicInstancing=1
r.ParallelFrustumCull=1
r.RHICmdUseThread=1
r.RHICmdUseDeferredContexts=1
r.RHICmdBypass=0
r.OneFrameThreadLag=1
r.GTSyncType=1

; --- HARDWARE VIDEO DECODING, ANIMATIONS & LOW LATENCY ---
Electra.PC.UseSoftwareDecoding=0
a.URO.Enable=0
a.URO.EnableScreenRatio=0
t.Streamline.Reflex.HandleMaxTickRate=true
t.Streamline.Reflex.Enable=1
t.Streamline.Reflex.Mode=1

; --- SHADOWS (FULL FEATURES, STEPPED TO 1024 RESOLUTION) ---
r.LightFunctionQuality=2
r.ShadowQuality=4
r.Shadow.CSM.MaxCascades=3
r.Shadow.MaxResolution=1024
r.Shadow.PerObjectResolutionMax=1024
r.Shadow.PerObjectResolutionMin=1024
r.Shadow.DistanceScale=1.0
r.Shadow.RadiusThreshold=0.02
r.DistanceFieldShadowing=1
r.DFShadowQuality=3
r.ContactShadows=1

; --- VOXEL FOG, LIGHTING & AMBIENT OCCLUSION (-20% FROM NATIVE) ---
r.VolumetricFog=1
r.VolumetricFog.GridPixelSizeK=20
r.VolumetricFog.GridSizeZ=52
r.VolumetricFog.HistoryWeight=0.9
r.VolumetricCloud=1
r.LightShaftQuality=1
r.LightShaftDownSampleFactor=2
r.Kuro.KuroTyndallScatteringsDownSampleFactor=2
r.TyndallScatteringQuality=1
r.KuroVolumetricLight.ColorMaskDownSampleFactor=4
r.KuroVolumetricLight.DownSampleFactor=4
r.SSFS=1
r.SSFS.DownSampleFator=2
r.AmbientOcclusionLevels=2
r.AODownsampleFactor=2
r.AmbientOcclusion.Intensity=0.72

; --- LIGHT REFLECTIONS / SSR (-20% FROM NATIVE) ---
r.ScreenSpaceReflections=1
r.SSR.Quality=2
r.SSR.MaxRoughness=0.48
r.SSR.HalfResSceneColor=1
r.RefractionQuality=2

; --- RAY TRACING & LUMEN DISABLED ---
r.RayTracing=0
r.RayTracing.Shadows=0
r.RayTracing.Reflections=0
r.RayTracing.AmbientOcclusion=0
r.RayTracing.GlobalIllumination=0
r.Lumen.DiffuseIndirect.Allow=0
r.Lumen.Reflections.Allow=0

; --- VEGETATION (-5% FROM NATIVE) & UNCHANGED CHARACTER QUALITY ---
foliage.DensityScale=0.95
grass.DensityScale=0.95
foliage.LODDistanceScale=0.95
foliage.DensityScaleLOD.DrawCallOptimize=1
r.Kuro.Foliage.NearCullDistanceMax=9260
r.Kuro.Foliage.MiddleCullDistanceMax=14960
r.Kuro.Foliage.FarCullDistanceMax=21375
r.Kuro.Foliage.GrassCullDistanceMax=21375
r.Kuro.Foliage.Grass3_0CullDistanceMax=28500
r.ViewDistanceScale=1.0
r.StaticMeshLODDistanceScale=0.85
r.MeshBlend.Quality=3
r.SkeletalMeshLODBias=0

; --- FULL BATTLE & COMBAT FX QUALITY ---
fx.MaxCPUParticlesPerEmitter=1500
fx.MaxGPUParticlesSpawnedPerFrame=2048
fx.Niagara.QualityLevel=3
r.KuroDownsampleTranslucencyFullRes=true
r.Kuro.InteractionEffect.UseCppWaterEffect=1
r.MotionBlurQuality=0
r.DepthOfFieldQuality=0
r.LensFlareQuality=2
r.SceneColorFringeQuality=0
r.TranslucencyVolumeBlur=1
r.EyeAdaptationQuality=2
r.BloomQuality=2
r.Tonemapper.Quality=1
r.Tonemapper.Sharpen=0.25
r.Kuro.KuroEnableFFTBloom=0
r.Kuro.KuroEnableToonFFTBloom=0
r.Kuro.KuroBloomStreak=0
r.Kuro.NiagaraBlur.Enable=0

; --- UI & NATIVE SCALING ---
r.VRS.Enable=0
r.Upscale.Quality=3
r.DetailMode=2
r.PostProcessAAQuality=3
r.ScreenPercentage=100
