[SystemSettings]
; ==============================================================================
; === PROFILE: MEDIUM (PERFECT BALANCE 60 FPS)                              ===
; === Target: 4-6 Core CPUs, 8GB-16GB RAM, GTX 1050Ti / GTX 1650 / RTX 3050 4GB===
; ==============================================================================

; --- MEMORY & TEXTURE STREAMING ---
r.Streaming.PoolSize=2400
r.Streaming.LimitPoolSizeToVRAM=1
r.Streaming.UseBackgroundThreadPool=1
r.Streaming.AmortizeCPUToGPUCopy=1
r.Streaming.MaxNumTexturesToStreamPerFrame=30
r.Streaming.FramesForFullUpdate=20
r.Streaming.Boost=0
r.Streaming.HLODStrategy=2
r.Streaming.UsingKuroStreamingPriority=3

; --- CPU MULTITHREADING & SHADER PIPELINE ---
r.CreateShadersOnLoad=1
r.Shaders.Optimize=1
r.ShaderPipelineCache.BatchSize=50
r.ShaderPipelineCache.BackgroundBatchSize=10
r.ShaderPipelineCache.BatchTime=2.0
r.ShaderPipelineCache.PrecompileBatchTime=2.0
r.ParallelRendering=1
r.MeshDrawCommands.ParallelPassSetup=1
r.ParallelFrustumCull=1
r.RHICmdUseThread=1
r.RHICmdUseDeferredContexts=1
r.RHICmdBypass=0

; --- HARDWARE VIDEO DECODING & ANIMATIONS ---
Electra.PC.UseSoftwareDecoding=0
a.URO.Enable=0
a.URO.EnableScreenRatio=0

; --- LIGHTING & SHADOWS ---
r.LightFunctionQuality=1
r.ShadowQuality=2
r.Shadow.CSM.MaxCascades=2
r.Shadow.MaxResolution=1024
r.Shadow.PerObjectResolutionMax=1024
r.Shadow.PerObjectResolutionMin=1024
r.Shadow.RadiusThreshold=0.04
r.Shadow.DistanceScale=0.9
r.DistanceFieldShadowing=0
r.ContactShadows=0
r.VolumetricFog=0
r.VolumetricCloud=0
r.LightShaftQuality=1

; --- AMBIENT OCCLUSION & REFLECTIONS ---
r.AmbientOcclusionLevels=1
r.ScreenSpaceReflections=1
r.SSR.Quality=1
r.SSR.MaxRoughness=1.0
r.RefractionQuality=1

; --- POST-PROCESSING & CLEAN VISUALS ---
r.MotionBlurQuality=0
r.DepthOfFieldQuality=0
r.LensFlareQuality=1
r.SceneColorFringeQuality=0
r.TranslucencyVolumeBlur=0
r.EyeAdaptationQuality=1
r.BloomQuality=2
r.Tonemapper.Quality=1
r.Tonemapper.Sharpen=0.4
r.Kuro.KuroEnableFFTBloom=0
r.Kuro.KuroEnableToonFFTBloom=0
r.Kuro.KuroBloomStreak=0
r.Kuro.NiagaraBlur.Enable=0

; --- VEGETATION, DENSITY & VIEW DISTANCE ---
foliage.DensityScale=0.75
grass.DensityScale=0.75
foliage.DensityScaleLOD.DrawCallOptimize=1
r.ViewDistanceScale=0.95
r.StaticMeshLODDistanceScale=1.0
r.MeshBlend.Quality=2
r.SkeletalMeshLODBias=0

; --- PARTICLES & COMBAT FX ---
fx.MaxCPUParticlesPerEmitter=600
fx.MaxGPUParticlesSpawnedPerFrame=512
fx.Niagara.QualityLevel=1

; --- UI & SCALING ---
r.Upscale.Quality=3
r.DetailMode=2
r.PostProcessAAQuality=2
r.ScreenPercentage=100
