<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 84" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141923" />
      <stop offset="50%" stop-color="#1a2233" />
      <stop offset="100%" stop-color="#121620" />
    </linearGradient>

    <!-- Animated Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5E5B" />
      <stop offset="35%" stop-color="#FCA311" />
      <stop offset="70%" stop-color="#00D2FF" />
      <stop offset="100%" stop-color="#FF5E5B" />
    </linearGradient>

    <!-- Button Gradient -->
    <linearGradient id="btnGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5E5B" />
      <stop offset="100%" stop-color="#FF385C" />
    </linearGradient>

    <!-- Soft Drop Shadow Filter -->
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5" />
    </filter>

    <style>
      /* Steam rising animation */
      @keyframes steam1 {
        0% { transform: translateY(0px) scale(0.85); opacity: 0; }
        40% { opacity: 0.8; }
        80% { transform: translateY(-7px) scale(1.1); opacity: 0.2; }
        100% { transform: translateY(-12px) scale(1.25); opacity: 0; }
      }
      @keyframes steam2 {
        0% { transform: translateY(0px) scale(0.85); opacity: 0; }
        40% { opacity: 0.85; }
        80% { transform: translateY(-8px) scale(1.15); opacity: 0.25; }
        100% { transform: translateY(-13px) scale(1.3); opacity: 0; }
      }

      /* Heart pulsing animation */
      @keyframes heartBeat {
        0%, 100% { transform: scale(1); }
        15% { transform: scale(1.25); }
        30% { transform: scale(1.08); }
        45% { transform: scale(1.2); }
        60% { transform: scale(1); }
      }

      /* Glowing border pulse */
      @keyframes borderPulse {
        0%, 100% { opacity: 0.6; }
        50% { opacity: 1; }
      }

      /* Support button soft glow */
      @keyframes btnGlow {
        0%, 100% { filter: drop-shadow(0 2px 5px rgba(255, 94, 91, 0.4)); transform: scale(1); }
        50% { filter: drop-shadow(0 4px 12px rgba(255, 94, 91, 0.85)); transform: scale(1.02); }
      }

      .steam-left {
        transform-box: fill-box;
        transform-origin: center;
        animation: steam1 2.2s infinite ease-out;
      }
      .steam-right {
        transform-box: fill-box;
        transform-origin: center;
        animation: steam2 2.2s infinite ease-out 1.1s;
      }
      .heart-anim {
        transform-box: fill-box;
        transform-origin: center;
        animation: heartBeat 2s infinite ease-in-out;
      }
      .border-pulse {
        animation: borderPulse 3s infinite ease-in-out;
      }
      .btn-pulse {
        transform-box: fill-box;
        transform-origin: center;
        animation: btnGlow 2.5s infinite ease-in-out;
      }

      .title-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        font-weight: 700;
        font-size: 14.5px;
        fill: #FFFFFF;
        letter-spacing: 0.3px;
      }
      .sub-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        font-weight: 500;
        font-size: 11.5px;
        fill: #94A3B8;
      }
      .btn-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        font-weight: 700;
        font-size: 12.5px;
        fill: #FFFFFF;
        letter-spacing: 0.4px;
      }
    </style>
  </defs>

  <!-- Container Card -->
  <g filter="url(#softShadow)">
    <rect x="3" y="3" width="354" height="78" rx="16" fill="url(#bgGrad)" />
    <rect x="3" y="3" width="354" height="78" rx="16" fill="none" stroke="url(#borderGrad)" stroke-width="1.8" class="border-pulse" />
  </g>

  <!-- Coffee Mug Section -->
  <g transform="translate(18, 17)">
    <!-- Animated Steam -->
    <path class="steam-left" d="M14,14 C12,9 16,6 14,1" fill="none" stroke="#FFD166" stroke-width="1.6" stroke-linecap="round" />
    <path class="steam-right" d="M22,14 C20,9 24,6 22,1" fill="none" stroke="#FFD166" stroke-width="1.6" stroke-linecap="round" />

    <!-- Mug Body -->
    <path d="M6,17 C6,15 8,15 10,15 L26,15 C28,15 30,15 30,17 L29,38 C28.5,43 24,46 18,46 C12,46 7.5,43 7,38 Z" fill="#FFFFFF" />
    
    <!-- Mug Handle -->
    <path d="M29,19 C34,19 36,22 36,27 C36,32 33,35 28.5,35" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" />

    <!-- Saucer / Base -->
    <ellipse cx="18" cy="46" rx="16" ry="2.2" fill="#CBD5E1" />

    <!-- Beating Heart on Mug -->
    <g class="heart-anim">
      <path d="M18,33.5 C18,33.5 12,29.5 12,25.5 C12,23.5 13.5,22 15.5,22 C16.8,22 17.6,22.8 18,23.4 C18.4,22.8 19.2,22 20.5,22 C22.5,22 24,23.5 24,25.5 C24,29.5 18,33.5 18,33.5 Z" fill="#FF5E5B" />
    </g>
  </g>

  <!-- Information Text -->
  <g transform="translate(70, 34)">
    <text x="0" y="0" class="title-text">Buy Me a Coffee</text>
    <text x="0" y="19" class="sub-text">Support on ko-fi.com/jonathanssa</text>
  </g>

  <!-- CTA Action Pill Button -->
  <g class="btn-pulse" transform="translate(236, 23)">
    <rect x="0" y="0" width="108" height="38" rx="19" fill="url(#btnGrad)" />
    <!-- Mini Cup Icon -->
    <g transform="translate(13, 11) scale(0.65)">
      <path d="M2,4 L18,4 L16.5,17 C16,20 13,22 10,22 C7,22 4,20 3.5,17 Z" fill="#FFFFFF" />
      <path d="M18,6 C21,6 22,8 22,10.5 C22,13 20.5,15 17.5,15" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" />
      <path d="M10,10 C10,10 7,8 7,6 C7,5 7.5,4.5 8.5,4.5 C9.2,4.5 9.7,5 10,5.4 C10.3,5 10.8,4.5 11.5,4.5 C12.5,4.5 13,5 13,6 C13,8 10,10 10,10 Z" fill="#FF5E5B" />
    </g>
    <text x="35" y="24" class="btn-text">Support</text>
  </g>
</svg>

