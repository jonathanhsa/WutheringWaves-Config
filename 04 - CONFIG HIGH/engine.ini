[SystemSettings]
; ==============================================================================
; === PROFILE: HIGH SPEC (CRISP VISUALS & ENHANCED LIGHTING)                 ===
; === Target: 6+ Core CPUs, 16GB+ RAM, RTX 2060 / 3060 / 4060, RX 6600/7600  ===
; ==============================================================================

; --- MEMORY & TEXTURE STREAMING ---
r.Streaming.PoolSize=4200
r.Streaming.LimitPoolSizeToVRAM=1
r.Streaming.UseBackgroundThreadPool=1
r.Streaming.AmortizeCPUToGPUCopy=1
r.Streaming.MaxNumTexturesToStreamPerFrame=40
r.Streaming.FramesForFullUpdate=15
r.Streaming.Boost=1
r.Streaming.HLODStrategy=1
r.Streaming.UsingKuroStreamingPriority=3

; --- CPU MULTITHREADING & SHADER PIPELINE ---
r.CreateShadersOnLoad=1
r.Shaders.Optimize=1
r.ShaderPipelineCache.BatchSize=100
r.ShaderPipelineCache.BackgroundBatchSize=20
r.ShaderPipelineCache.BatchTime=2.0
r.ShaderPipelineCache.PrecompileBatchTime=2.0
r.ParallelRendering=1
r.MeshDrawCommands.ParallelPassSetup=1
r.ParallelFrustumCull=1
r.RHICmdUseThread=1
r.RHICmdUseDeferredContexts=1
r.RHICmdBypass=0

; --- HARDWARE VIDEO DECODING & ANIMATIONS ---
Electra.PC.UseSoftwareDecoding=0
a.URO.Enable=0
a.URO.EnableScreenRatio=0
t.Streamline.Reflex.HandleMaxTickRate=true
t.Streamline.Reflex.Enable=1
t.Streamline.Reflex.Mode=1

; --- LIGHTING & SHADOWS ---
r.LightFunctionQuality=2
r.ShadowQuality=3
r.Shadow.CSM.MaxCascades=3
r.Shadow.MaxResolution=2048
r.Shadow.PerObjectResolutionMax=1024
r.Shadow.PerObjectResolutionMin=1024
r.Shadow.DistanceScale=1.2
r.Shadow.RadiusThreshold=0.03
r.DistanceFieldShadowing=1
r.DFShadowQuality=2
r.ContactShadows=1
r.VolumetricFog=1
r.VolumetricFog.GridPixelSizeK=16
r.VolumetricFog.GridSizeZ=64
r.VolumetricCloud=1
r.LightShaftQuality=1

; --- AMBIENT OCCLUSION & REFLECTIONS ---
r.AmbientOcclusionLevels=2
r.AODownsampleFactor=2
r.ScreenSpaceReflections=1
r.SSR.Quality=2
r.SSR.MaxRoughness=1.0
r.RefractionQuality=2

; --- POST-PROCESSING & CLEAN VISUALS ---
r.MotionBlurQuality=0
r.DepthOfFieldQuality=0
r.LensFlareQuality=2
r.SceneColorFringeQuality=0
r.TranslucencyVolumeBlur=1
r.EyeAdaptationQuality=2
r.BloomQuality=2
r.Tonemapper.Quality=1
r.Tonemapper.Sharpen=0.3
r.Kuro.KuroEnableFFTBloom=0
r.Kuro.KuroEnableToonFFTBloom=0
r.Kuro.KuroBloomStreak=0
r.Kuro.NiagaraBlur.Enable=0

; --- VEGETATION, DENSITY & VIEW DISTANCE ---
foliage.DensityScale=1.0
grass.DensityScale=1.0
foliage.LODDistanceScale=1.5
foliage.DensityScaleLOD.DrawCallOptimize=1
r.Kuro.Foliage.NearCullDistanceMax=9750
r.Kuro.Foliage.MiddleCullDistanceMax=15750
r.Kuro.Foliage.FarCullDistanceMax=22500
r.Kuro.Foliage.GrassCullDistanceMax=22500
r.Kuro.Foliage.Grass3_0CullDistanceMax=30000
r.ViewDistanceScale=1.2
r.StaticMeshLODDistanceScale=0.85
r.MeshBlend.Quality=3
r.SkeletalMeshLODBias=0

; --- PARTICLES & COMBAT FX ---
fx.MaxCPUParticlesPerEmitter=1000
fx.MaxGPUParticlesSpawnedPerFrame=1024
fx.Niagara.QualityLevel=2

; --- UI & SCALING ---
r.Upscale.Quality=3
r.DetailMode=2
r.PostProcessAAQuality=3
r.ScreenPercentage=100
