[SystemSettings]
; ==============================================================================
; === WARNING: ULTRA OVERKILL PROFILE (EXTREME HARDWARE MELTER)              ===
; === Target: Enthusiast Flagship Rig (RTX 4080 / 4090 / RX 7900 XTX, 32GB+) ===
; === Warning: Unconstrained draw distances, 125% internal supersampling,    ===
; === ultra volumetric voxel grids, zero polygon LOD reduction.              ===
; ==============================================================================

; --- MEMORY & TEXTURE STREAMING (MAXIMUM VRAM CONSUMPTION) ---
; Allocates massive 12GB texture streaming cache to prevent any texture pop-in
r.Streaming.PoolSize=12000
r.Streaming.LimitPoolSizeToVRAM=0
r.Streaming.UseBackgroundThreadPool=1
r.Streaming.AmortizeCPUToGPUCopy=0
r.Streaming.MaxNumTexturesToStreamPerFrame=120
r.Streaming.FramesForFullUpdate=5
r.Streaming.Boost=2
r.Streaming.HLODStrategy=0
r.MaxAnisotropy=16

; --- CPU MULTITHREADING & SHADER PIPELINE ---
r.CreateShadersOnLoad=1
r.Shaders.Optimize=1
r.ShaderPipelineCache.BatchSize=300
r.ShaderPipelineCache.BackgroundBatchSize=60
r.ShaderPipelineCache.BatchTime=4.0
r.ShaderPipelineCache.PrecompileBatchTime=4.0
r.ParallelRendering=1
r.MeshDrawCommands.ParallelPassSetup=1
r.RHICmdUseThread=1
r.RHICmdUseDeferredContexts=1
r.RHICmdBypass=0
r.FinishCurrentFrame=0
r.OneFrameThreadLag=1
r.GTSyncType=1

; --- LIGHTING & SHADOWS (EXTREME 4K RESOLUTION & 6 CASCADES) ---
r.LightFunctionQuality=3
r.ShadowQuality=5
r.Shadow.CSM.MaxCascades=6
r.Shadow.MaxResolution=4096
r.Shadow.DistanceScale=3.0
r.Shadow.RadiusThreshold=0.005
r.Shadow.FadeResolution=256
r.Shadow.MinResolution=128
r.DistanceFieldShadowing=1
r.ContactShadows=1

; --- VOLUMETRIC FOG & CLOUDS (ULTRA VOXEL DENSITY) ---
r.VolumetricFog=1
r.VolumetricFog.GridPixelSizeK=4
r.VolumetricFog.GridSizeZ=256
r.VolumetricCloud=1
r.VolumetricCloud.HighQuality=1
r.LightShaftQuality=1

; --- AMBIENT OCCLUSION & REFLECTIONS (RAYTRACE-LIKE SCREEN SPACE) ---
r.AmbientOcclusionLevels=3
r.AmbientOcclusionMaxQuality=100
r.ScreenSpaceReflections=1
r.SSR.Quality=4
r.SSR.MaxRoughness=1.0
r.RefractionQuality=3

; --- POST-PROCESSING & CINEMATIC EFFECTS ---
r.MotionBlurQuality=0
r.DepthOfFieldQuality=0
r.LensFlareQuality=3
r.SceneColorFringeQuality=0
r.TranslucencyVolumeBlur=1
r.EyeAdaptationQuality=2
r.BloomQuality=4
r.Tonemapper.Quality=1
r.Tonemapper.Sharpen=0.2

; --- VEGETATION, DENSITY & VIEW DISTANCE (ZERO LOD DEGRADATION) ---
; 250% foliage and grass density, 300% view distance, permanently locks full-mesh LOD0
foliage.DensityScale=2.5
grass.DensityScale=2.5
r.ViewDistanceScale=3.0
r.StaticMeshLODDistanceScale=0.1
r.SkeletalMeshLODBias=-2

; --- PARTICLES & COMBAT FX (UNCONSTRAINED PARTICLE FLOOD) ---
fx.MaxCPUParticlesPerEmitter=5000
fx.MaxGPUParticlesSpawnedPerFrame=8192
fx.Niagara.QualityLevel=4

; --- SUPERSAMPLING & ANTI-ALIASING ---
; 125% internal resolution supersampling for pristine sub-pixel definition
r.PostProcessAAQuality=4
r.TemporalAA.Algorithm=0
r.TemporalAACurrentFrameWeight=0.15
r.ScreenPercentage=125
